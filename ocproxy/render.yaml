# Render Blueprint for a single ocproxy egress endpoint.
#
# Point Render at this file (Blueprint Path: ocproxy/render.yaml). Each instance
# gives one extra egress IP: anonymous quota is per IP, so it is registered as a
# second litellm deployment of the same model and the router fails across them.
#
# Cloudflare fronts Render and answers CONNECT with 400, so the instance is used
# as an OpenAI endpoint, not as a raw proxy. See RENDER.md.
#
# The litellm host runs the keepalive cron (render-keepalive.sh), because a Free
# web service spins down after 15 minutes without inbound traffic and cron jobs
# on Render are billed separately.
services:
  - type: web
    name: ocproxy-egress-1
    runtime: docker
    plan: free
    region: frankfurt
    branch: litellm_quota_foundation
    dockerContext: ocproxy
    dockerfilePath: ocproxy/Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # no proxy file: this instance IS the egress, so it serves direct-only
    dockerCommand: node serve.mjs --host 0.0.0.0
    envVars:
      # generated on the litellm host; see RENDER.md
      - key: OC_KEY
        sync: false
      # CONNECT is refused for anything else, so this stays a closed relay
      - key: OC_CONNECT_ALLOW
        value: opencode.ai:443
      - key: OC_MODELS
        value: deepseek-v4.1-flash-free
      - key: NODE_ENV
        value: production
